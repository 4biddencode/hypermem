name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write  # Required for trusted publishing (OIDC) to PyPI.
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # Only publish from the canonical repo, not forks.
    if: github.repository == '4biddencode/hypermem'
    # Named environment so PyPI trusted publishing only accepts runs from it.
    environment: pypi
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Verify long description renders (README)
        run: twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
